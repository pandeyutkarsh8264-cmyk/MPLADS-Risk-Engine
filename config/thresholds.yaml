# Risk score band thresholds
# Locked prototype values: 0-29 Low, 30-59 Medium, 60-79 High, 80-100 Critical/Very High
risk_bands:
  low:
    min: 0.0
    max: 29.99
    label: "Low Risk"
    color: "green"
  medium:
    min: 30.0
    max: 59.99
    label: "Medium Risk"
    color: "yellow"
  high:
    min: 60.0
    max: 79.99
    label: "High Risk"
    color: "orange"
  critical:
    min: 80.0
    max: 100.0
    label: "Critical Risk"
    color: "red"

# Engine specific score cutoffs
cutoffs:
  peer_outlier_warning: 60.0
  peer_outlier_severe: 80.0
  stat_outlier_warning: 60.0
  stat_outlier_severe: 80.0
  mismatch_warning: 60.0
  mismatch_severe: 80.0
  duplicate_likely: 85.0
  duplicate_possible: 65.0
